version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Expo pins its own SDK-matched versions; bump those with `npx expo install --fix`.
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "react"
      - dependency-name: "react-native*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
