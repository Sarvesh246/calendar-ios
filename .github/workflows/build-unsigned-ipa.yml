name: Build unsigned iOS .ipa

# Native-shell changes build a fresh sideloadable artifact automatically.
# Ordinary Datebook web updates still need only the Vercel deployment because
# the wrapper loads the live site. workflow_dispatch remains for rebuilds.
on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - "codex/**"
    paths:
      - ".github/workflows/build-unsigned-ipa.yml"
      - "App.tsx"
      - "LockScreen.tsx"
      - "NativeChrome.tsx"
      - "app.json"
      - "index.ts"
      - "package.json"
      - "package-lock.json"
      - "assets/**"
      - "lib/**"
      - "modules/**"
      - "targets/**"

concurrency:
  group: unsigned-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the npm major version (11.x, bundled with Node 24) that
          # package-lock.json is generated with locally — `npm ci` validates
          # the lockfile strictly enough that Node 20's older bundled npm
          # rejected it ("Missing: typescript@5.9.3 from lock file") even
          # though `npm install`/`npm ci` both succeed clean locally.
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Type-check native code
        run: npx tsc --noEmit

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios

      - name: Validate Live Activity target membership and entitlements
        run: bash scripts/validate-live-activity-prebuild.sh "$PWD"

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list \
            | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' \
            | sed -n '1p' | xargs)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

      - name: Package as .ipa
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          APP=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -n1)
          bash scripts/validate-live-activity-bundle.sh "$APP"
          cp -r "$APP" build/Payload/
          cd build
          zip -qr Datebook-unsigned.ipa Payload
          shasum -a 256 Datebook-unsigned.ipa
          du -h Datebook-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Datebook-unsigned-ipa
          path: build/Datebook-unsigned.ipa
          retention-days: 14
